name: Release

# Push a tag like v0.1.0 to publish to PyPI. One-time setup: on pypi.org add a
# "trusted publisher" for this repo, workflow release.yml, environment "pypi".
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the package version
        run: |
          version=$(uv run --no-project python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/digikey_datasheet_mcp/__init__.py').read())[1])")
          test "v$version" = "$GITHUB_REF_NAME"
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
