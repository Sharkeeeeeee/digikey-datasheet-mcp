[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "digikey-datasheet-mcp"
dynamic = ["version"]
description = "MCP server for DigiKey part search, pricing, BOM costing, LCSC lookup and datasheet reading (pinout, absolute max ratings, electrical specs)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Sharkeeeeeee" }]
keywords = ["mcp", "model-context-protocol", "digikey", "lcsc", "jlcpcb", "datasheet", "electronics", "bom", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pypdf>=5.4",
]

[project.urls]
Homepage = "https://github.com/Sharkeeeeeee/digikey-datasheet-mcp"
Issues = "https://github.com/Sharkeeeeeee/digikey-datasheet-mcp/issues"

[project.scripts]
digikey-datasheet-mcp = "digikey_datasheet_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.hatch.version]
path = "src/digikey_datasheet_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/digikey_datasheet_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
